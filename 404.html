<style>
:root{color-scheme:dark;--k0:#050505;--k1:#0d0d0d;--k2:#141414;--k3:#1b1b1b;--k4:#242424;--g1:#343434;--g3:#6b6b6b;--g4:#9a9a9a;--s1:#b8b8b8;--s2:#d6d6d4;--s3:#f4f4f2;
--metal:linear-gradient(135deg,#8f8f8f 0%,#e9e9e7 28%,#a3a3a3 52%,#f6f6f4 76%,#9b9b9b 100%);
--h:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;--b:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
--cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);--hdr:60px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 12px);-webkit-text-size-adjust:100%;background:var(--k0)}
body{margin:0;background:var(--k1);color:var(--s2);font:400 17px/1.55 var(--b);-webkit-font-smoothing:antialiased}
a{color:var(--s2)}
:focus-visible{outline:3px solid var(--s3);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:#fff;color:#000;padding:8px 12px;z-index:99}
.w{width:min(1120px,100% - 40px);margin-inline:auto}
header{position:sticky;top:0;z-index:20;background:var(--k0);border-bottom:1px solid var(--g1)}
header .w{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:var(--hdr)}
.mark{display:block;font:800 21px/1 var(--h);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--s2);background:var(--metal);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.mark small{display:block;margin-top:3px;font:700 8.5px/1 var(--b);letter-spacing:.5em;-webkit-text-fill-color:var(--s1)}
header nav{display:flex;gap:26px;align-items:center}
header nav a{color:var(--s1);text-decoration:none;font:500 15px var(--b)}
header nav a:hover{color:var(--s3)}
.hc{display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border:1px solid var(--g3);background:transparent;color:var(--s3);font:700 16px/1.1 var(--b);text-decoration:none;text-align:center;transition:background-color .2s,filter .2s}
.btn:hover{background:var(--g1)}
.btn.p{background:var(--metal);color:#0a0a0a;border-color:transparent;clip-path:var(--cut)}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{min-height:40px;padding:0 16px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:12px}.row.mt{margin-top:30px}
.demo{margin:0;padding:8px 14px;background:var(--k4);border-bottom:1px solid var(--g1);color:var(--s2);font:600 12.5px/1.35 var(--b)}
.demo span{display:block;max-width:70em;margin-inline:auto}
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:center;padding:clamp(28px,6vw,84px) max(20px,calc((100vw - 1120px)/2))}
.hero::before{content:"";position:absolute;right:-6%;top:-10%;width:34%;height:130%;background:linear-gradient(115deg,transparent 0 46%,#8c8c8c 46% 48.4%,transparent 48.4% 100%);opacity:.45;pointer-events:none}
.hx-copy{position:relative;z-index:1;max-width:640px;padding:clamp(22px,3.2vw,44px);background:rgba(13,13,13,.92);border-left:5px solid var(--g3)}
.ey{display:inline-block;margin:0 0 12px;padding:4px 12px 4px 10px;background:var(--g1);color:var(--s2);font:700 12px/1.3 var(--b);letter-spacing:.14em;text-transform:uppercase;border-left:3px solid var(--s1)}
h1,h2,h3{font-family:var(--h);margin:0}
h1{font-weight:700;font-size:clamp(38px,6vw,72px);line-height:1;letter-spacing:-.02em;color:var(--s3)}
h1 em,h2 em{font-style:normal;background:var(--metal);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h2{font-weight:600;font-size:clamp(30px,4vw,52px);line-height:1.04;letter-spacing:-.018em;color:var(--s3)}
.lead{margin:22px 0 26px;max-width:32em;font-size:clamp(17px,1.5vw,20px);line-height:1.45}
.hx-card{position:relative;z-index:1;padding:26px;background:var(--k3);border-left:6px solid var(--s1);clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,0 100%)}
.hx-card p{margin:0}.hx-card .k{font:700 12.5px var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--g4)}
.hx-card .v{margin:6px 0 18px;font:600 26px/1.15 var(--h);color:var(--s3)}
section{padding:clamp(48px,7vw,88px) 0}
section:nth-of-type(even){background:var(--k2)}
.sec-p{max-width:46em;margin:16px 0 28px;color:var(--s1);font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:8px}
.card{padding:24px;background:var(--k3);border:1px solid var(--g1);border-top:4px solid var(--g3)}
.card h3{font:600 22px/1.15 var(--h);color:var(--s3);margin-bottom:8px}.card p{margin:0;color:var(--s2)}
.cars{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.car{display:flex;flex-direction:column;gap:6px;padding:22px;background:var(--k3);border:1px solid var(--g1);border-left:5px solid var(--g3)}
.car h3{font:600 22px/1.15 var(--h);color:var(--s3)}.car .m{margin:0;color:var(--s1);font-size:15.5px}
.car .pr{margin:6px 0 0;font:700 22px var(--h);color:var(--s3)}.car .n{margin:0;color:var(--g4);font-size:13.5px}
.car .btn{margin-top:auto;align-self:flex-start}
.vacio{padding:26px;background:var(--k3);border-left:6px solid var(--g3)}.vacio p{margin:0 0 18px;max-width:42em}
.ct{background:var(--k0)!important;border-top:1px solid var(--g1)}
.ct-g{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,56px);margin-top:26px;align-items:start}
dl{margin:0}dt{font:700 12.5px var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--g4);margin-top:20px}dt:first-child{margin-top:0}
dd{margin:4px 0 0;font-size:19px;color:var(--s3)}dd a{color:var(--s3);text-decoration-thickness:2px;text-underline-offset:4px}
.ct-c{padding:28px;background:var(--k3);border-left:6px solid var(--s1);clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,0 100%)}
.ct-t{margin:0 0 8px;font:600 28px/1.1 var(--h);color:var(--s3)}.ct-c p{margin:0 0 20px}
.src{display:block;margin-top:4px;font-size:13.5px;color:var(--g4)}
footer{background:#000;color:var(--s1);padding:28px 0 calc(44px + env(safe-area-inset-bottom,0));font-size:14px;border-top:1px solid var(--g1)}
footer p{margin:4px 0}footer a{color:var(--s3)}
.doc{max-width:46em}.doc h2{font-size:clamp(26px,3vw,36px);margin:34px 0 8px}.doc p,.doc li{color:var(--s2)}
.nf{min-height:100vh;display:grid;place-items:center;padding:32px 20px;text-align:center}.nf h1{font-size:clamp(34px,6vw,56px)}.nf p{margin:16px 0 26px}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding:20px 16px 36px}.ct-g{grid-template-columns:1fr}}
@media(max-width:700px){header nav{display:none}.btn{width:100%}.row .btn{flex:1 1 100%}header .hc .btn{width:auto}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

</head>

</body>
