/* ===== Identidad v2 · paleta del logo: tinta #0a1012, sol #f2d21b, hueso #f8f8f8 y sus tonos ===== */
:root{--y3:#fff3a1;--yd:#6e5d00;--rule:#243138}
/* Ornamento de títulos: el sol asomando sobre la línea del horizonte */
h2::after{content:"";display:block;width:132px;height:16px;margin-top:16px;background:radial-gradient(circle at 26px 16px,var(--y) 0 14px,transparent 15px),linear-gradient(var(--s3),var(--s3)) left bottom/100% 3px no-repeat}
.doc h2::after,.nf h1::after{content:none}
/* Barra de datos rápidos */
.bar{background:var(--y);color:var(--ink);border-bottom:6px solid var(--ink)}
.bar ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.bar li{display:flex;flex-direction:column;gap:2px;padding:16px 20px;border-left:3px solid var(--ink)}
.bar li:first-child{border-left:0;padding-left:0}
.bar .k{font:800 11.5px var(--b);letter-spacing:.2em;text-transform:uppercase;color:#3c3400}
.bar b,.bar a{font:800 19px/1.15 var(--h);color:var(--ink);text-transform:uppercase}
.bar a{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.bar a:hover{background:var(--ink);color:var(--y);text-decoration:none}
.bar small{font-size:13px;color:#2b2500}
.bar :focus-visible{outline-color:var(--ink)}
.ant{margin:-10px 0 16px;font-size:14px;color:var(--y)}
dd .ant{display:block;margin:2px 0 0;font-size:14px;color:var(--y)}
/* Hero: más aire y jerarquía */
.lead{font-size:clamp(18px,1.6vw,21px)}
/* Tarjetas con sombra de sol */
.card{transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:6px 6px 0 var(--y)}
section.lt:not(.ct) .card:hover{box-shadow:6px 6px 0 var(--ink)}
/* Cómo comprar: banda amarilla de punta a punta */
#como-comprar{background:var(--y)!important;color:var(--ink);--s1:#1b2428;--s2:#0a1012;--s3:#0a1012;--g1:#0a1012;--acc:#0a1012;--fo:#0a1012}
#como-comprar .ey{background:var(--ink);color:var(--y)}
#como-comprar h2 em{background:var(--ink);color:var(--y);padding:0 .14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#como-comprar :focus-visible{outline-color:var(--ink)}
/* Preguntas y glosario */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,48px);align-items:start}
.qa h3{margin:0 0 14px;font:800 22px/1.1 var(--h);text-transform:uppercase;color:var(--s3)}
details.dd{margin:0 0 10px;background:var(--k3);border:1px solid var(--g1);border-left:8px solid var(--y)}
details.dd summary{position:relative;display:block;min-height:52px;padding:15px 56px 15px 18px;cursor:pointer;list-style:none;font:800 17px/1.3 var(--b);color:var(--s3)}
details.dd summary::-webkit-details-marker{display:none}
details.dd summary::after{content:"+";position:absolute;right:14px;top:50%;width:28px;height:28px;margin-top:-14px;display:grid;place-items:center;background:var(--y);color:var(--ink);font:800 22px/1 var(--h)}
details.dd[open] summary::after{content:"–"}
details.dd[open] summary{border-bottom:1px solid var(--g1)}
details.dd p{margin:0;padding:14px 18px 18px;color:var(--s2)}
/* Nosotros: cifras */
.stats{display:flex;flex-wrap:wrap;gap:16px;margin:8px 0 26px}
.stat{flex:1 1 220px;padding:22px 22px 20px;background:var(--ink);color:#fff;border-bottom:8px solid var(--y)}
.stat b{display:block;font:800 clamp(54px,8vw,86px)/.9 var(--h);color:var(--y)}
.stat span{display:block;margin-top:10px;font-size:15px;color:#e6eaeb}
/* Horario */
.estado{display:inline-block;margin:0 0 12px;padding:7px 14px;font:800 13px/1.2 var(--b);letter-spacing:.07em;text-transform:uppercase;background:var(--k4);color:var(--s3);border-left:8px solid var(--g3)}
.estado[data-abierto="1"]{background:var(--y);color:var(--ink);border-left-color:var(--ink)}
.bar b[data-estado]{display:block;padding:0;background:none;border:0;letter-spacing:0;text-transform:uppercase;font:800 19px/1.15 var(--h)}
.hrs{width:100%;max-width:460px;border-collapse:collapse}
.hrs th,.hrs td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--rule);font-size:16px;color:var(--s3)}
.hrs th{font:800 12.5px var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--y);white-space:nowrap}
.hrs tr.hoy{background:var(--y)}.hrs tr.hoy th,.hrs tr.hoy td{color:var(--ink)}
/* Contacto: sucursales del grupo */
.grp{margin-top:48px;padding-top:30px;border-top:4px solid var(--y)}
.grp h3{font:800 clamp(24px,3vw,32px)/1.05 var(--h);text-transform:uppercase;color:var(--s3)}
.grp-l{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.grp-l li{display:flex;flex-direction:column;gap:5px;padding:18px;background:var(--k3);border-top:6px solid var(--y)}
.grp-l b{font:800 18px/1.1 var(--h);text-transform:uppercase;color:#fff}
.grp-l span{font-size:15px;color:var(--s1)}
.grp-l a{font-weight:700;color:var(--y);text-underline-offset:3px}
/* Pie */
.ft{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px;padding-bottom:22px;margin-bottom:18px;border-bottom:1px solid var(--rule)}
.ft p{margin:3px 0}
.ft-b{font:800 22px/1 var(--h);text-transform:uppercase;color:#fff}
.ft-k{font:800 12px var(--b)!important;letter-spacing:.2em;text-transform:uppercase;color:var(--y)}
.ft-a{color:var(--y)}
/* Botón flotante de WhatsApp (solo celular) */
.fab{display:none;opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .2s ease,transform .2s ease}.fab-visible .fab{opacity:1;pointer-events:auto;transform:none}
@media(max-width:700px){
  .fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 20px 0 14px;background:var(--y);color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--y);font:800 14px var(--b);letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
  .fab span{width:22px;height:11px;border-radius:22px 22px 0 0;background:var(--ink)}
  footer{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:900px){.bar ul{grid-template-columns:1fr 1fr}.bar li{border-left:0;padding-left:0;border-top:3px solid var(--ink)}.bar li:nth-child(-n+2){border-top:0}.qa,.ft{grid-template-columns:1fr}}

.mark .lg-img{display:block;height:46px;width:auto;background:#fefefe;padding:4px 10px}
.lg-ft{display:block;height:64px;width:auto;background:#fefefe;padding:6px 14px;margin:0 0 14px}
.lg-sec{display:block;height:72px;width:auto;max-width:100%;margin:0 0 14px;border:1px solid var(--g3)}
.lg-404{display:block;height:84px;width:auto;max-width:80%;margin:0 auto 26px;background:#fefefe;padding:6px 14px}
.nf>div::before{display:none}
@media(max-width:980px){.mark .lg-img{height:40px}}

/* Hero: atardecer sobre el horizonte del logotipo. Escena 100 % CSS (sin fotografía): ver docs/HERO.md para sumar una foto propia */
header{border-bottom:1px solid rgba(255,255,255,.14)}

.hero{--hero-img:none;--hero-shade:transparent;isolation:isolate;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);align-items:center;min-height:min(760px,calc(100svh - 76px));padding:clamp(40px,6vw,88px) max(20px,calc((100vw - 1120px)/2)) clamp(72px,9vw,110px);border-bottom:2px solid rgba(255,255,255,.55);
background:linear-gradient(90deg,var(--hero-shade),transparent 70%),var(--hero-img) center/cover no-repeat,radial-gradient(circle at 75% 20%,rgba(255,219,62,.12),transparent 24%),linear-gradient(120deg,#060a0d 0%,#101d27 44%,#543224 100%)}
.hx-copy{position:relative;z-index:2;max-width:680px}
.hx-copy .ey{padding:0;background:none;color:var(--y);margin:0 0 18px;letter-spacing:.22em}
.hero h1{font-size:clamp(34px,4.6vw,66px);line-height:.96;text-wrap:balance;max-width:none}
.hero h1 em{display:block}
.hero .lead{max-width:27em;margin:22px 0 30px;color:var(--s1)}
.hero .row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.hx-sun{position:absolute;z-index:1;right:clamp(-120px,-4vw,0px);bottom:0;width:clamp(260px,38vw,560px);aspect-ratio:2/1;pointer-events:none}
.hx-sun .orb{position:absolute;inset:0;border-radius:50% 50% 0 0/100% 100% 0 0;background:var(--y)}
.hx-down{position:absolute;z-index:2;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:44px;color:var(--s2);font:800 11px var(--b);letter-spacing:.24em;text-transform:uppercase;text-decoration:none}
.hx-down::after{content:"";width:10px;height:10px;border-right:2px solid var(--y);border-bottom:2px solid var(--y);transform:rotate(45deg)}
.hx-down:hover{color:var(--y)}
/* Datos comerciales: continúan la escena (el suelo oscuro bajo el horizonte) */
.bar{background:var(--k0);color:var(--s2);border-bottom:1px solid rgba(255,255,255,.1)}
.bar li{position:relative;padding:20px 22px 20px 62px;border-left:1px solid rgba(255,255,255,.14)}
.bar li:first-child{padding-left:62px;border-left:0}
.bar li svg{position:absolute;left:20px;top:22px;width:28px;height:28px;stroke:var(--y);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar li:first-child svg{left:20px}
.bar .k{color:var(--y)}
.bar b,.bar a,.bar b[data-estado]{color:var(--s3);font-size:18px}
.bar a{text-decoration-color:var(--y);text-decoration-thickness:2px}
.bar a:hover{background:none;color:var(--y)}
.bar small{color:var(--g4)}
.bar :focus-visible{outline-color:var(--y)}
.btn.lnk{min-height:44px;padding:0;border:0;background:none;color:var(--s3);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;text-decoration-color:var(--y)}
.btn.lnk:hover{background:none;color:var(--y)}
@media(prefers-reduced-motion:no-preference){
.hx-sun .orb{animation:alba 1s cubic-bezier(.2,.7,.2,1) both}
.hx-copy{animation:entra .5s ease-out both}

/* ===== v3 · Unidades (5 columnas + filtros), comparador y «Cómo comprar» ===== */
.w.wide{width:min(1560px,100% - 40px)}
/* Panel de filtros */
.fx{margin:0 0 22px;background:var(--k3);border:1px solid var(--g1);border-top:6px solid var(--y)}
.fx-top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:16px;align-items:end;padding:18px 20px}
.fx .f{display:flex;flex-direction:column;gap:6px;min-width:0}
.fx .f label,.fx legend{font:800 12px var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--g4)}
.fx input[type=search],.fx select{width:100%;min-height:46px;padding:8px 12px;border:2px solid var(--g3);border-radius:0;background:var(--k1);color:var(--s3);font:400 16px var(--b)}
.fx input[type=search]:focus,.fx select:focus{border-color:var(--y)}
.fx option:disabled{color:var(--g3)}
.fx-tg{min-height:46px}
.fx-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px 24px;padding:20px;border-top:1px solid var(--g1)}
.fg{margin:0;padding:0;border:0;min-width:0}
.fg legend{padding:0;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:block}
.chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:2px solid var(--g3);color:var(--s2);font:700 14.5px var(--b);transition:background-color .15s,border-color .15s}
.chip em{font-style:normal}
.chip b{font:700 12px var(--b);color:var(--g4)}
.chip:hover input:not(:disabled):not(:checked)+span{border-color:var(--y)}
.chip input:checked+span{background:var(--y);border-color:var(--y);color:var(--ink)}
.chip input:checked+span b{color:var(--ink)}
.chip input:focus-visible+span{outline:3px solid var(--fo);outline-offset:2px}
.chip input:disabled{cursor:not-allowed}
.chip input:disabled+span{opacity:.35}
.rng{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg-n{margin:8px 0 0;font-size:13px;color:var(--g4)}
.sw{display:inline-block;flex:none;width:14px;height:14px;border-radius:50%;background:var(--sw);border:2px solid rgba(255,255,255,.6);vertical-align:-2px}
.chip input:checked+span .sw{border-color:var(--ink)}
.fx-act{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 20px;border-top:1px solid var(--g1);background:var(--k2)}
.fx-n{margin:0;font-weight:700;color:var(--s2)}
.fx-tags{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.tag{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 10px 0 12px;border:2px solid var(--y);background:transparent;color:var(--s3);font:700 13.5px var(--b);cursor:pointer}

/* Bandeja del comparador */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--y);color:var(--ink);border-top:4px solid var(--ink);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.tray .w{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}

.tray-i button:hover{color:#fff}
.tray .btn{border-color:var(--ink);color:var(--ink)}

.tray .btn.p{background:var(--ink);color:var(--y);border-color:var(--ink);clip-path:none}

.tray .btn:disabled{opacity:.55;cursor:not-allowed}
.tray :focus-visible{outline-color:var(--ink)}
body.has-tray{padding-bottom:calc(var(--tray-h,84px) + 8px)}
body.has-tray .fab{display:none}
html.has-dlg{overflow:hidden}
/* Ventana de comparación */
dialog.cmp{width:min(1200px,100% - 24px);max-height:calc(100dvh - 24px);margin:auto;padding:0;border:0;border-top:8px solid var(--y);background:#f8f8f8;color:#1b2428;color-scheme:light;--s1:#33414a;--s2:#1b2428;--s3:#0a1012;--g1:#cfd5d7;--g3:#7b878d;--g4:#4d5a61;--fo:#0a1012;overflow:auto}

.cmp-hd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px 12px}

.cmp-sc{overflow-x:auto;padding:0 24px 8px}.cmp-sc.mas{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.cmpt{--fc:150px;--uc:150px;width:100%;min-width:calc(var(--fc) + var(--n,2) * var(--uc));table-layout:fixed;border-collapse:separate;border-spacing:0}

/* Cómo comprar: una ruta con el sol saliendo a cada paso */
#como-comprar{overflow:hidden}
#como-comprar h2::after,.quick-proof h2::after{content:none}
.ruta{list-style:none;margin:44px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.ruta li{position:relative;padding:108px 30px 6px 0}
.ruta li::before{content:"";position:absolute;top:76px;left:0;right:0;height:18px;background:linear-gradient(90deg,var(--y) 0 22px,transparent 22px 44px) 0 50%/44px 4px repeat-x,var(--ink)}
.ruta li:first-child::before{left:calc(-1 * max(20px,(100vw - 1120px) / 2))}
.ruta li:last-child::before{right:calc(-1 * max(20px,(100vw - 1120px) / 2))}
.ruta .sol{position:absolute;left:0;top:0;width:76px;height:76px;overflow:hidden}
.ruta .sol s{display:block;width:76px;height:76px;border-radius:50%;background:var(--ink);transform:translateY(calc((1 - var(--ph)) * 100%))}
.ruta h3{margin:0 0 10px;font:800 clamp(28px,2.8vw,38px)/1 var(--h);text-transform:uppercase;color:var(--ink)}
.ruta p{margin:0;max-width:24em;color:var(--ink);font-size:17px}
.ruta .btn{margin-top:18px;border-color:var(--ink);color:var(--ink)}
.ruta .btn:hover{background:var(--ink);color:var(--y)}
@media(max-width:1000px){
  .ruta{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:34px}
  .ruta li:nth-child(odd)::before{left:calc(-1 * max(20px,(100vw - 1120px) / 2));right:0}
  .ruta li:nth-child(even)::before{right:calc(-1 * max(20px,(100vw - 1120px) / 2));left:0}
}
@media(max-width:620px){
  .ruta{grid-template-columns:1fr;margin-top:30px}
  .ruta li::before{left:-20px!important;right:-20px!important}
}
@media(prefers-reduced-motion:no-preference){
  .ruta.js .sol s{transform:translateY(100%)}
  .ruta.js.on .sol s{transform:translateY(calc((1 - var(--ph)) * 100%));transition:transform 1s cubic-bezier(.2,.7,.2,1)}
  .ruta.js.on li:nth-child(2) .sol s{transition-delay:.25s}
  .ruta.js.on li:nth-child(3) .sol s{transition-delay:.5s}
  .ruta.js.on li:nth-child(4) .sol s{transition-delay:.75s}
}

/* ── UX · áreas táctiles (≥44px) en pantallas táctiles o estrechas; desktop conserva su densidad ── */
@media(pointer:coarse),(max-width:980px){
  .menu-toggle,.btn.sm,.fx-tg{min-height:44px}
  .car-c{min-height:44px;display:inline-flex;align-items:center}
  dd a,li>a:not(.btn),.ct-c li a{display:inline-flex;align-items:center;min-height:44px}
  .ft p a,footer p a{display:inline-flex;align-items:center;min-height:44px;padding-inline:2px}
  .nav-more-links a,.site-nav a{min-height:44px;display:flex;align-items:center}
}
/* Cuerpo de texto: los enlaces dentro de párrafos conservan su flujo, con más aire para el dedo */
@media(pointer:coarse){p a:not(.btn){padding-block:6px}}

/* ── UX · legibilidad y header en pantallas muy angostas ── */
@media(max-width:380px){#contacto h2{font-size:clamp(28px,9.4vw,40px)}} /* evita partir «ENCONTRARNOS» a mitad de palabra */

/* ── UX · tarjetas alineadas: en cada fila comparten líneas (cabecera, título, año/km, ficha, precio) ── */
.car-f{display:flex;flex-direction:column;gap:12px;min-width:0}
.car-f .pr{margin-top:auto}
@supports (grid-template-rows:subgrid){
  @media(min-width:520px){
    .car{display:grid;grid-row:span 5;grid-template-rows:subgrid;row-gap:12px;align-content:start}
    .car-f{align-content:start}
    .car h3{min-height:0}
    .car-f .pr{margin-top:0}
    .car-f .btn{margin-top:auto}
  }
}

/* ── UX · guía en acordeón nativo (abierto en desktop, plegado en mobile) y CTA de financiación ── */
.gd>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.gd>summary::-webkit-details-marker{display:none}
.gd>summary h3{margin:0}
.gd>summary::after{content:"+";flex:none;display:grid;place-items:center;width:32px;height:32px;border:2px solid currentColor;font:800 20px/1 var(--b)}
.gd[open]>summary::after{content:"\2212"}
.gd[open]>summary{margin-bottom:8px}
.fin-cta{margin-top:26px}
/* Header de una sola fila en celulares (≤399px): el WhatsApp sigue en el hero, el menú y el botón flotante */
@media(max-width:399px){header .w{flex-wrap:nowrap;gap:10px;padding-top:0}header .hc{display:none} /* WhatsApp sigue en el hero, en el menú y en el botón flotante */.mark .lg-img{height:40px}.menu-toggle{margin-left:auto}}
